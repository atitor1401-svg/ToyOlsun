<style>
  :root{--ink:#2c2623;--gold:#c7a24a;--cream:#f7f3ee;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 90% at 50% 20%,#fffdf9 0%,#f3ece1 100%);color:var(--ink);
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 20px;}
  .card{width:100%;max-width:440px;text-align:center;}
  .brand{font-family:Georgia,'Times New Roman',serif;font-size:40px;font-weight:700;
    letter-spacing:.5px;color:var(--ink);}
  .brand b{color:var(--gold);}
  .kick{margin-top:6px;font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  .divider{width:54px;height:2px;background:var(--gold);margin:22px auto;border-radius:2px;opacity:.7;}
  h1{font-size:26px;line-height:1.25;font-weight:700;margin:4px 0 8px;}
  p.sub{font-size:16px;color:#6f675f;line-height:1.5;margin-bottom:26px;}
  .stores{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .badge{display:inline-block;transition:transform .1s;}
  .badge:active{transform:scale(.96);}
  #ios img{height:54px;width:auto;display:block;}
  #android img{height:80px;width:auto;display:block;margin:-13px 0;}
  .redir{margin-top:14px;font-size:14px;color:#8a827a;min-height:18px;}
  .note{margin-top:22px;font-size:13px;color:#9b938a;}
  .note a{color:var(--gold);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Toy <b>Olsun</b></div>
    <div class="kick">Toy Planlama Tətbiqi</div>
    <div class="divider"></div>
    <h1>Tətbiqi pulsuz yüklə</h1>
    <p class="sub">Zal, müğənni, DJ, foto-video, dekor — hamısı bir tətbiqdə. Toyunu telefonundan planla.</p>
    <div class="stores">
      <a class="badge" id="ios" href="https://apps.apple.com/az/app/toy-olsun/id6808000909">
        <img src="app-store.svg" alt="Download on the App Store">
      </a>
      <a class="badge" id="android" href="https://play.google.com/store/apps/details?id=com.ibo96.ToyOlsun">
        <img src="google-play.png" alt="Get it on Google Play">
      </a>
    </div>
    <div class="redir" id="redir"></div>
    <p class="note">Veb versiya: <a href="https://toyolsun.world/">toyolsun.world</a></p>
  </div>

<script>
(function(){
  var ios='https://apps.apple.com/az/app/toy-olsun/id6808000909';
  var android='https://play.google.com/store/apps/details?id=com.ibo96.ToyOlsun';
  var ua=navigator.userAgent||navigator.vendor||'';
  var isIOS=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var isAndroid=/android/i.test(ua);
  function go(url,plat){try{fbq('trackCustom','AppStoreRedirect',{platform:plat});}catch(e){}
    document.getElementById('redir').textContent='Mağazaya yönləndirilirsiniz…';
    setTimeout(function(){window.location.href=url;},350);}
  if(isIOS) go(ios,'ios');
  else if(isAndroid) go(android,'android');
})();
</script>
</body>
</html>
