<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Olsun</title>
<meta property="og:title" content="Toy Olsun — toy xidmətləri bir tətbiqdə">
<meta property="og:description" content="Zallar, artistlər, DJ, foto və video, kortej, gəlinlik, gül və dekor.">
<meta property="og:image" content="https://atitor1401-svg.github.io/ToyOlsun/assets/images/icon.png">
<style>
  :root { --ink:#2C2623; --gold:#D4AF37; --cream:#FAF8F5; --muted:#8A7E75; --border:#EFECE6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .brand { text-align:center; font-family:Georgia,serif; letter-spacing:3px; font-weight:700; font-size:20px; margin:4px 0 2px; }
  .line { width:40px; height:2px; background:var(--gold); margin:8px auto 18px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:18px; overflow:hidden; }
  .photo { width:100%; aspect-ratio:4/5; object-fit:cover; background:var(--border); display:block; }
  .body { padding:16px; }
  .cat { color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  h1 { font-family:Georgia,serif; font-size:24px; margin:6px 0 8px; }
  .price { font-size:18px; font-weight:700; }
  .addr { color:var(--muted); font-size:14px; margin-top:8px; }
  .desc { font-size:14px; line-height:1.5; margin-top:12px; white-space:pre-line; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:700; font-size:16px;
         padding:14px; border-radius:14px; margin-top:12px; }
  .primary { background:var(--ink); color:#fff; }
  .ghost { background:#fff; color:var(--ink); border:1px solid var(--border); }
  .stores { display:flex; gap:10px; }
  .stores .btn { flex:1; font-size:14px; }
  .msg { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">TOY OLSUN</div>
  <div class="line"></div>
  <div id="content"><div class="msg">Yüklənir…</div></div>
  <a class="btn primary" id="openApp" href="#">Tətbiqdə aç</a>
  <div class="stores">
    <a class="btn ghost" href="https://apps.apple.com/app/id6808000909">App Store</a>
    <a class="btn ghost" href="https://play.google.com/store/apps/details?id=com.ibo96.ToyOlsun">Google Play</a>
  </div>
</div>
<script>
(function () {
  var SUPABASE_URL = 'https://xokarxcpcjvmassjheka.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhva2FyeGNwY2p2bWFzc2poZWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjY0OTgsImV4cCI6MjEwMzM0MjQ5OH0.7TbuRbILV6XiMIps36eQBkDJcLXNzVBPZjZmlgwStwQ';
  var CATS = { venues:'Zallar', artists:'Artistlər', dj:'DJ', media:'Foto & Video', cars:'VIP Kortej',
               wedding_dress:'Gəlinlik', flowers:'Gül Dükanı', decor:'Dekor', tourism:'Bal Ayı' };
  var id = new URLSearchParams(location.search).get('id') || '';
  if (!/^\d+$/.test(id)) id = '';
  var content = document.getElementById('content');
  var openBtn = document.getElementById('openApp');

  var appUrl = 'toyolsun://service' + (id ? '?id=' + id : '');
  var isAndroid = /android/i.test(navigator.userAgent);
  openBtn.href = isAndroid
    ? 'intent://service' + (id ? '?id=' + id : '') + '#Intent;scheme=toyolsun;package=com.ibo96.ToyOlsun;' +
      'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.ibo96.ToyOlsun') + ';end'
    : appUrl;

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function money(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  if (!id) { content.innerHTML = '<div class="msg">Toy Olsun tətbiqində toyunuz üçün hər şeyi bir yerdə tapın.</div>'; return; }

  fetch(SUPABASE_URL + '/rest/v1/service?select=title,price,unit,img,images,category,address,description' +
        '&status=eq.approved&id=eq.' + id, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      var s = rows && rows[0];
      if (!s) { content.innerHTML = '<div class="msg">Bu xidmət hazırda mövcud deyil.</div>'; return; }
      document.title = s.title + ' — Toy Olsun';
      var photo = (s.images && s.images[0]) || s.img || '';
      content.innerHTML =
        '<div class="card">' +
          (photo ? '<img class="photo" alt="" src="' + esc(photo) + '">' : '') +
          '<div class="body">' +
            '<div class="cat">' + esc(CATS[s.category] || '') + '</div>' +
            '<h1>' + esc(s.title) + '</h1>' +
            '<div class="price">' + money(s.price) + ' ' + esc(s.unit || 'AZN') + '</div>' +
            (s.address ? '<div class="addr">📍 ' + esc(s.address) + '</div>' : '') +
            (s.description ? '<div class="desc">' + esc(s.description) + '</div>' : '') +
          '</div>' +
        '</div>';
    })
    .catch(function () { content.innerHTML = '<div class="msg">Məlumat yüklənmədi. Tətbiqdə açın.</div>'; });
})();
</script>
</body>
</html>
